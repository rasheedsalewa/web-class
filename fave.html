<html>
    <head>
        <title>HTML:FORM</title>
        <body>
            <form>
                <label>Your comment below*</label> <br>
                <textarea cols="50" rows="5"></textarea required disabled><br>
                <label>choose the country you are from below</label> <br>

                <Select>
                    <option>NIGERIA</option>
                    <option>GHANA</option>
                    <option>CANADA</option>
                    <option>LONDON</option>
                    <option>CHINA</option>
                    <option>CHICAGO</option>
                    <option>LYBIA</option>
                    <option>TANZANIA</option>
                </Select>
                <br>
                <label>Your full name</label>
                <input type="text" placeholder="e.g omosalewa" disabled>
                <br>

                <input type="number" min="500">
                <br>

                <input type="email" value="e.g rasheedsalewa@gmail.com">
                <br>
                <label>Your passport</label>
                <input type="file" multiple>
                <br>
                <Input type="radio"><label>male</label>
                <Input type="radio"><label>female</label>
                <br>
                <input type="checkbox"> <label>I agree to this terms and conditions</label><br>
                <br>
                <label>date</label>
                <input type="date"required>
                <br>
                <label>Month</label>
                <input type="month">
                <br>
                <label>colour</label>
                <Input type="colour">
                <br>
                <label>Range</label>
                <Input type="range">
                <br><br><br><button>SUBMIT</button>

            </form>  
        </body>
    </head>
</html>
